name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm test
      - name: the example rules are ready
        run: npm run check
      - name: the conformance files are current
        run: |
          npm run cases
          git diff --exit-code -- conformance
      - name: no raw invisible characters anywhere in the code
        run: python3 test/evidence/no-invisible.py packages conformance docs examples test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ matrix.python }}" }
      - working-directory: packages/python
        run: python -m unittest discover -s tests -t . -v
      - name: the wheel builds
        working-directory: packages/python
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir /tmp/wheel .

  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "${{ matrix.java }}" }
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - working-directory: packages/java
        run: gradle test --console=plain

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go/go.mod, cache-dependency-path: go/go.sum }
      - working-directory: go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - working-directory: packages/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "8.0.x" }
      - working-directory: packages/dotnet
        run: |
          dotnet test tests/RegexParity.Tests
          dotnet pack src/RegexParity --output /tmp/nupkg

  ruby:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.1", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with: { ruby-version: "${{ matrix.ruby }}" }
      - working-directory: packages/ruby
        run: |
          gem install minitest --no-document
          ruby -Ilib -Itest test/test_regex_parity.rb
          gem build regex-parity.gemspec
