name: demo

# Publishes docs/demo as https://yauhenbichel.github.io/regex-parity/, with the JavaScript and Python
# packages copied next to it, so the page always runs the code on main.
on:
  push:
    branches: [main]
    paths:
      - "docs/demo/**"
      - "packages/js/src/**"
      - "packages/python/regex_parity/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: assemble the site
        run: |
          mkdir -p _site
          cp docs/demo/index.html _site/index.html
          cp packages/js/src/index.js _site/regex-parity.js
          cp packages/python/regex_parity/__init__.py _site/regex_parity.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
