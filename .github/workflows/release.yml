name: release

# Publishes every package when a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match the version in every package (scripts/check-versions.py). Each registry job runs
# only once that registry is set up and its repository variable is "true"; docs/RELEASING.md has the
# one-time steps. Wherever a registry supports it, authentication is a short-lived OIDC token issued
# to this workflow, not a stored secret.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - id: version
        name: every package carries the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/check-versions.py "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: |
          python3 scripts/check-versions.py "${{ needs.verify.outputs.version }}" --notes > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "regex-parity $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  go:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: tag the Go module and have the Go proxy fetch it
        run: |
          tag="go/v${{ needs.verify.outputs.version }}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists"
          else
            gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha="${{ github.sha }}"
          fi
          curl -fsS --retry 5 --retry-delay 15 "https://proxy.golang.org/github.com/!yauhen!bichel/regex-parity/go/@v/v${{ needs.verify.outputs.version }}.info"
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    needs: verify
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@12.0.2
      - working-directory: packages/js
        # NPM_TOKEN is only for the very first release, before a trusted publisher can be added.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: verify
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - working-directory: packages/python
        run: |
          cp ../../LICENSE .
          python -m pip install --quiet build==1.6.1
          python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with: { packages-dir: packages/python/dist }

  crates:
    needs: verify
    if: vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # crates.io accepts a trusted publisher only after a crate's first release; until then this step
      # fails and CARGO_REGISTRY_TOKEN is used instead.
      - id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - working-directory: packages/rust
        run: |
          cp ../../LICENSE .
          cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

  nuget:
    needs: verify
    if: vars.PUBLISH_NUGET == 'true'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "8.0.x" }
      - working-directory: packages/dotnet
        run: dotnet pack src/RegexParity --configuration Release --output out
      - id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with: { user: "${{ vars.NUGET_USER }}" }
      - working-directory: packages/dotnet
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

  rubygems:
    needs: verify
    if: vars.PUBLISH_RUBYGEMS == 'true'
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with: { ruby-version: "3.4" }
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - working-directory: packages/ruby
        run: |
          gem build regex-parity.gemspec
          gem push "regex-parity-${{ needs.verify.outputs.version }}.gem"

  maven:
    needs: verify
    if: vars.PUBLISH_MAVEN == 'true'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - working-directory: packages/java
        run: gradle publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
