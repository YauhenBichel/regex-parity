[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regex-parity"
version = "0.1.0"
description = "One set of regular-expression rules, the same answer in Python, JavaScript and Java, even on text with accents, look-alike or invisible characters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["regex", "unicode", "normalization", "nfkc", "cross-language", "guardrails", "content-moderation", "pii"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Text Processing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/YauhenBichel/regex-parity"

[tool.hatch.build.targets.wheel]
packages = ["regex_parity"]
