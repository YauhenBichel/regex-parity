plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.github.yauhenbichel'
version = '0.1.0'
description = 'One set of regular-expression rules, the same answer in Java, JavaScript and Python.'

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

repositories { mavenCentral() }

dependencies {
    // No runtime dependencies: java.util.regex and java.text.Normalizer are the whole engine.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'regex-parity'
            from components.java
        }
    }
}
